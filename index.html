for(var i=1;i<a.length;i++){var x=a[i];if(!x||x[0]==null)continue;if(String(x[0]).indexOf('Applied')===0){note=String(x[0]);break}
var r={n:x[1],otif:x[2],ont:x[3],inf:x[4],ret:x[5],ord:x[6],amt:x[7]};if(String(x[0])==='Total')o.tot=r;else if(x[1])o.rows.push(r)}
var m=note.match(/after\s+[A-Za-z]+,\s+([A-Za-z]+ \d+, \d{4})[\s\S]*?before\s+[A-Za-z]+,\s+([A-Za-z]+ \d+, \d{4})/);
if(m){var s=new Date(m[1]),b=new Date(m[2]);o.days=Math.max(1,Math.round((b-s)/864e5));var e=new Date(b-864e5);o.dt=e;o.label=o.days===1?dl(e):s.getDate()+'–'+dl(e)}return o}
function fp(){var a=sh('First pick'),out=[];if(!a)return out;for(var b=0;b<5;b++){var c=b*5,rows=[],tot=null;for(var i=1;i<a.length;i++){var x=a[i];if(!x||x[c]==null)continue;if(String(x[c]).indexOf('Applied')===0)break;var r={n:x[c],t:x[c+1],o:x[c+2]||0};r.s=r.t?1-r.o/r.t:null;if(String(x[c])==='Total')tot=r;else rows.push(r)}out.push({rows:rows,tot:tot})}return out}
function init(){K={d:kp(sh('KPI Daily')),m:kp(sh('KPI -mtd'))};FP=fp();var d=K.d.dt;hd=d?d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2):'';R()}
function miss(n){return '<p class="note">ไม่พบชีต '+E(n)+' ในไฟล์</p>'}
function hdp(k){return '<p class="pd">'+(per==='d'?'Daily: ':'MTD: ')+E(k.label)+'</p>'}
function seg(){return '<div class="seg"><button data-p="d" class="'+(per==='d'?'on':'')+'">Daily</button><button data-p="m" class="'+(per==='m'?'on':'')+'">MTD</button></div>'}
function t0(){var k=K[per];if(!k.tot)return miss('KPI Daily / KPI -mtd');var s=k.rows.filter(function(r){return isS(r.n)})[0];
function cd(t,r,h){return '<div class="cd'+(h?' hi':'')+'"><h3>'+t+'</h3><div class="mm">'+met('OTIF',pc(r.otif))+met('OnTime',pc(r.ont))+met('InFull',pc(r.inf))+'</div></div>'}
var h=seg()+hdp(k)+'<div class="g2">'+(s?cd('68 Salaya',s,1):'')+cd('Area 5 total',k.tot,0)+'</div><h2>OTIF แยกตามสาขา</h2>';
k.rows.slice().sort(function(a,b){return b.otif-a.otif}).forEach(function(r,i){h+='<div class="rw'+(isS(r.n)?' hi':'')+'"><div class="rn"><span>'+(i+1)+'</span><b>'+E(r.n)+'</b></div><div class="r3">'+[['OTIF',r.otif],['OnTime',r.ont],['InFull',r.inf]].map(function(x){return '<div><small>'+x[0]+' '+pc(x[1])+'</small>'+bar(x[1])+'</div>'}).join('')+'</div></div>'});return h}
function t1(){var k=K[per];if(!k.tot)return miss('KPI Daily / KPI -mtd');var s=k.rows.filter(function(r){return isS(r.n)})[0],m=per==='m';
function cd(t,r,h,sh2){return '<div class="cd'+(h?' hi':'')+'"><h3>'+t+'</h3><div class="mm">'+met('Sales',mf(r.amt))+met('Orders',nf(r.ord))+(sh2?met('Share',pc(r.amt/k.tot.amt)):met('Avg/order',mf(r.amt/r.ord)))+(m?met('Sales/day',mf(r.amt/k.days))+met('Orders/day',nf(r.ord/k.days))+met('Avg/order',mf(r.amt/r.ord)):'')+'</div></div>'}
var mx=Math.max.apply(null,k.rows.map(function(r){return r.amt})),h=seg()+hdp(k)+'<div class="g2">'+(s?cd('68 Salaya',s,1,1):'')+cd('Area 5 total',k.tot,0,0)+'</div><h2>Sales แยกตามสาขา</h2>';
k.rows.slice().sort(function(a,b){return b.amt-a.amt}).forEach(function(r,i){h+='<div class="rw'+(isS(r.n)?' hi':'')+'"><div class="rn"><span>'+(i+1)+'</span><b>'+E(r.n)+'</b></div><div class="r2"><small>'+mf(r.amt)+' · '+nf(r.ord)+' orders'+(m?' · '+mf(r.amt/k.days)+'/day':'')+'</small>'+bar(r.amt/mx)+'</div></div>'});return h}
function t2(){if(!FP.length)return miss('First pick');var b=FP[fb],h='<div class="chips">'+FPN.map(function(n,i){return '<button data-b="'+i+'" class="'+(i===fb?'on':'')+'">'+n+'</button>'}).join('')+'</div><p class="pd">% ที่ทำได้ (ไม่มี OOS) · Daily</p>';
if(b.tot)h+='<div class="g2"><div class="cd"><h3>Area 5 total</h3><div class="mm">'+met('% ที่ทำได้',pc(b.tot.s))+met('Orders',nf(b.tot.t))+met('OOS',nf(b.tot.o))+'</div></div></div>';
b.rows.slice().sort(function(x,y){return(y.s||0)-(x.s||0)}).forEach(function(r,i){h+='<div class="rw'+(isS(r.n)?' hi':'')+'"><div class="rn"><span>'+(i+1)+'</span><b>'+E(r.n)+'</b></div><div class="r2"><small>'+pc(r.s)+' · '+nf(r.t)+' orders · OOS '+nf(r.o)+'</small>'+bar(r.s||0)+'</div></div>'});
return h+'<h2>68 Salaya: % ที่ทำได้ รายวัน (MTD)</h2><div class="tbl"><div class="cv"><canvas id="tr"></canvas></div></div>'}
function trend(){var a=sh('First pick mtd 68'),c=[4,7,10,13,1][fb],o=[];if(!a)return o;for(var i=3;i<a.length;i++){var x=a[i];if(!x||x[c-1]==null||x[c]==null)continue;var d=typeof x[c-1]==='number'?new Date(Math.round((x[c-1]-25569)*864e5)):new Date(x[c-1]);if(isNaN(d))continue;o.push([d.getUTCDate()+'/'+(d.getUTCMonth()+1),1-x[c]])}return o}
function drawTr(){var cv=Q('#tr');if(!cv)return;var t=trend(),cs=getComputedStyle(document.documentElement);if(ch)ch.destroy();Chart.defaults.color=cs.getPropertyValue('--mut').trim();
ch=new Chart(cv,{type:'line',data:{labels:t.map(function(x){return x[0]}),datasets:[{label:FPN[fb],data:t.map(function(x){return x[1]}),borderColor:cs.getPropertyValue('--hi').trim(),tension:.3,pointRadius:2}]},options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:function(v){return(v*100).toFixed(0)+'%'}}}}}})}
function t3(){var a=sh('Productivity'),o={};(a||[]).forEach(function(x){if(x&&typeof x[0]==='string'){var k=x[0].trim().toLowerCase();if(k==='picker'||k==='loader')o[k]={a:x[1],t:x[2]}}});if(!o.picker&&!o.loader)return miss('Productivity');
return '<p class="pd">Actual เทียบ target</p><div class="g2">'+['picker','loader'].map(function(k){var r=o[k];if(!r)return '';var mx=Math.max(r.a,r.t)*1.1;return '<div class="cd hi"><h3>'+k.charAt(0).toUpperCase()+k.slice(1)+'</h3><div class="mm">'+met('Actual',r.a)+met('Target',r.t)+met('% of target',pc(r.a/r.t))+'</div><div style="margin-top:10px">'+bar(r.a/mx,r.t/mx)+'</div></div>'}).join('')+'</div><p class="note">เส้นดำคือ target</p>'}
function hc(day){var o={Picker:{n:0,AEC:0,Staff:0,s:{}},Loader:{n:0,AEC:0,Staff:0,s:{}},dn:0,ds:{}},a=sh('ตารางกะ picker'),col=-1,j;
if(a){var dr=a[5]||[];for(j=8;j<dr.length;j++)if(+dr[j]===day){col=j;break}
if(col>0)for(var i=6;i<a.length;i++){var x=a[i];if(!x||x[1]==null)continue;var pos=String(x[3]||''),ro=/loader/i.test(pos)?'Loader':/picker/i.test(pos)?'Picker':null;if(!ro)continue;var v=String(x[col]==null?'':x[col]).trim();if(!/^\d+$/.test(v))continue;var ty=/^AEC/i.test(pos)?'AEC':'Staff',R=o[ro];R.n++;R[ty]++;(R.s[v]=R.s[v]||{AEC:0,Staff:0})[ty]++}}
var b=sh('ตารางกะ Drover');if(b){col=-1;var h=b[1]||[];for(j=9;j<h.length;j++)if(+h[j]===day){col=j;break}
if(col>0)for(var i2=3;i2<b.length;i2++){var y=b[i2];if(!y||y[1]==null||y[2]==null)continue;var w=y[col];if(typeof w==='number'&&w>0){o.dn++;o.ds[w]=(o.ds[w]||0)+1}}}return o}
function tb(hs,rows){return '<table><tr>'+hs.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</table>'}
function shiftTbl(t,R){var ks=Object.keys(R.s).sort(function(a,b){return a-b});if(!ks.length)return '';return '<div class="tbl"><h3>'+t+' แยกกะ</h3>'+tb(['กะ','AEC','Staff','รวม'],ks.map(function(k){return [k,R.s[k].AEC,R.s[k].Staff,R.s[k].AEC+R.s[k].Staff]}))+'</div>'}
function t4(){var day=hd?+hd.slice(8):0,h='<div class="seg"><input type="date" id="hd" value="'+E(hd)+'"></div>';if(!day)return h+'<p class="note">เลือกวันที่</p>';var o=hc(day);
h+='<div class="g2">'+['Picker','Loader'].map(function(r){var x=o[r];return '<div class="cd hi"><h3>'+r+'</h3><div class="mm">'+met('รวม',x.n)+met('AEC',x.AEC)+met('Staff',x.Staff)+'</div></div>'}).join('')+'<div class="cd hi"><h3>Driver</h3><div class="mm">'+met('รวม',o.dn)+'</div></div></div>';
var pt=(sh('Productivity')||[]).filter(function(x){return x&&String(x[0]).trim().toLowerCase()==='picker'})[0],so=K.d.rows.filter(function(r){return isS(r.n)})[0];
if(pt&&so&&K.d.dt&&hd===(K.d.dt.getFullYear()+'-'+('0'+(K.d.dt.getMonth()+1)).slice(-2)+'-'+('0'+K.d.dt.getDate()).slice(-2)))h+='<p class="note">Picker capacity = '+o.Picker.n+' × '+pt[2]+' = '+nf(o.Picker.n*pt[2])+' orders เทียบกับ orders 68 Salaya (Daily) '+nf(so.ord)+'</p>';
h+=shiftTbl('Picker',o.Picker)+shiftTbl('Loader',o.Loader);var dk=Object.keys(o.ds).sort(function(a,b){return a-b});
if(dk.length)h+='<div class="tbl"><h3>Driver แยกกะ</h3>'+tb(['กะ','คน'],dk.map(function(k){return [k,o.ds[k]]}))+'</div>';
var mp=sh('manpower');if(mp){var rs=[];for(var i=2;i<mp.length;i++){var x=mp[i];if(x&&x[0]!=null&&typeof x[1]==='number')rs.push([E(x[0]),x[1],x[2],x[3],pc(x[4])])}if(rs.length)h+='<div class="tbl"><h3>Manpower: A เทียบ B</h3>'+tb(['ตำแหน่ง','A','B','ต่าง','%'],rs)+'</div>'}return h}
function eq(){var a=sh('Equipment'),o=[];if(!a)return o;for(var i=4;i<a.length;i++){var x=a[i];if(x&&x[7]&&x[5]&&typeof x[9]==='number')o.push({t:x[5],n:x[7],u:x[8],ok:x[9],tot:typeof x[14]==='number'?x[14]:x[9]+(x[10]||0)})}return o}
function eqL(){var L=eq().filter(function(r){return !q||String(r.n).toLowerCase().indexOf(q.toLowerCase())>=0}),h='',last='';L.forEach(function(r){if(r.t!==last){h+='<h2>'+E(r.t)+'</h2>';last=r.t}h+='<div class="er"><span>'+E(r.n)+'</span><b>'+nf(r.ok)+' '+E(r.u||'')+(r.tot>r.ok?' <span class="bad">ชำรุด '+(r.tot-r.ok)+'</span>':'')+'</b></div>'});return h||'<p class="note">ไม่พบรายการ</p>'}
function t5(){if(!sh('Equipment'))return miss('Equipment');return '<div class="seg"><input type="search" id="q" placeholder="ค้นหาอุปกรณ์" value="'+E(q)+'"></div><p class="note">จำนวนที่ใช้งานได้ของแต่ละอุปกรณ์ (ชำรุดแสดงแยก)</p><div class="cd" id="el">'+eqL()+'</div>'}
function R(){Q('#tabs').innerHTML=T.map(function(t,i){return '<button class="tb'+(i===tab?' on':'')+'" data-t="'+i+'">'+t+'</button>'}).join('');Q('#v').innerHTML=[t0,t1,t2,t3,t4,t5][tab]();if(tab===2)drawTr()}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset;if(d.t!=null){tab=+d.t;window.scrollTo(0,0)}else if(d.p){per=d.p}else if(d.b!=null){fb=+d.b}else return;R()});
document.addEventListener('input',function(e){if(e.target.id==='q'){q=e.target.value;Q('#el').innerHTML=eqL()}});
document.addEventListener('change',function(e){if(e.target.id==='hd'){hd=e.target.value;R()}});
Q('#f').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{var wb=XLSX.read(ev.target.result,{type:'array'}),d={},need=['KPI Daily','KPI -mtd','First pick','First pick mtd 68','Productivity','manpower','ตารางกะ picker','ตารางกะ Drover','Equipment'];
wb.SheetNames.forEach(function(n){if(need.indexOf(n.trim())>=0)d[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true})});D=d;Q('#fn').textContent=f.name;init()}catch(x){alert('อ่านไฟล์ไม่ได้ กรุณาเลือกไฟล์ .xlsx')}};r.readAsArrayBuffer(f)};
init();
</script></body></html>
