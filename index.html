function share(d,name){var pw=prompt('รหัสผ่านอัปโหลด เพื่อให้ทุกคนเห็นไฟล์นี้ (กด ยกเลิก = ดูเฉพาะเครื่องนี้)');if(!pw)return;
fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw,fileName:name,sheets:d})}).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})}).then(function(x){if(x.ok){SRC='อัปโหลดล่าสุด '+ts(new Date(x.j.updatedAt))+' · ไฟล์ '+name;init();alert('อัปโหลดสำเร็จ ทุกคนจะเห็นไฟล์นี้')}else alert(x.j.error||'อัปโหลดไม่สำเร็จ')}).catch(function(){alert('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ แสดงเฉพาะเครื่องนี้')})}
function getCode(){try{return localStorage.getItem('o2o_code')||''}catch(e){return ''}}
function setCode(c){try{if(c)localStorage.setItem('o2o_code',c);else localStorage.removeItem('o2o_code')}catch(e){}}
function lockMsg(m){document.body.classList.add('lock');Q('#v').innerHTML='<p class="note">'+E(m)+'</p>'}
function login(msg){document.body.classList.add('lock');Q('#v').innerHTML='<div class="cd" style="max-width:380px;margin:40px auto"><h3>กรุณาใส่รหัสเพื่อดูรายงาน</h3>'+(msg?'<p class="note" style="color:var(--ink)"><b>'+E(msg)+'</b></p>':'')+'<div class="xfl" style="grid-template-columns:1fr"><label>รหัสเข้าดู<input id="vc" type="password" autocomplete="current-password"></label></div><button id="vgo" class="pri">เข้าดู</button></div>'}
function loadShared(){var c=getCode();fetch('/api/data',{cache:'no-store',headers:c?{'x-view-code':encodeURIComponent(c)}:{}}).then(function(r){if(r.status===401){if(c)setCode('');login(c?'รหัสไม่ถูกต้อง':'');return null}if(r.status===429){lockMsg('ใส่รหัสผิดบ่อยเกินไป กรุณารอ 10 นาทีแล้วลองใหม่');return null}if(r.status===404)return{none:1};return r.ok?r.json():null}).then(function(j){if(!j)return;if(j.none){if(!Object.keys(D).length)lockMsg('ยังไม่มีข้อมูลบนเซิร์ฟเวอร์ — ผู้ดูแลกด "อัปโหลดไฟล์ใหม่" เพื่อส่งไฟล์ Excel');return}if(j.sheets){D=j.sheets;SRC='อัปโหลดล่าสุด '+ts(new Date(j.updatedAt))+' · ไฟล์ '+j.fileName;Q('#fn').textContent=j.fileName||'O2O Report';init()}}).catch(function(){if(!Object.keys(D).length)lockMsg('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้')})}
function vgo(){var v=Q('#vc');if(!v||!v.value)return;setCode(v.value.trim());loadShared()}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='vc')vgo()});
